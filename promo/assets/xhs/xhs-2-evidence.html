<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'>
<style>
:root{
  --paper:#f4ecda; --card:#fbf6ea; --ink:#3b3127; --ink2:#6f6353;
  --coral:#e07a4e; --coral-soft:#f0c7b1; --line:#d8cbb2;
  --warn:#c2502f; --warn-bg:#f7e2d6;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1080px;height:1440px;overflow:hidden;background:var(--paper);}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.card{
  width:1080px;height:1440px;padding:72px 68px;position:relative;
  background:
    radial-gradient(circle at 16% 6%, rgba(224,122,78,.07), transparent 42%),
    radial-gradient(circle at 90% 96%, rgba(224,122,78,.06), transparent 46%),
    var(--paper);
  display:flex;flex-direction:column;
}
.tag{display:inline-block;align-self:flex-start;font-size:26px;letter-spacing:.16em;color:var(--coral);
  font-weight:800;border:2px solid var(--coral-soft);border-radius:999px;padding:9px 26px;background:var(--card);}
.pager{position:absolute;top:78px;right:72px;font-size:26px;font-weight:800;color:var(--coral-soft);letter-spacing:.1em;}
.frame{background:var(--card);border:2px solid var(--line);border-radius:28px;overflow:hidden;
  box-shadow:0 10px 30px rgba(90,70,40,.08);}
.frame img{display:block;width:100%;}
h1{font-size:84px;line-height:1.16;letter-spacing:-.01em;font-weight:800;}
h1 .c{color:var(--coral);}
.sub{font-size:34px;line-height:1.55;color:var(--ink2);}
.swipe{font-size:30px;color:var(--coral);font-weight:700;}
.brand{font-size:30px;font-weight:800;}
.brand b{color:var(--coral);}
.url{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:27px;color:var(--ink2);}
/* card2 */
.flow{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:2px solid var(--line);border-radius:24px;padding:30px 16px;}
.flow .s{flex:1;text-align:center;}
.flow .n{font-size:72px;font-weight:800;color:var(--coral);line-height:1;}
.flow .l{font-size:26px;color:var(--ink2);margin-top:10px;line-height:1.3;}
.flow .ar{font-size:46px;color:var(--coral-soft);font-weight:800;}
.row{display:flex;align-items:center;gap:18px;background:var(--card);border:2px solid var(--line);
  border-radius:18px;padding:22px 26px;}
.row.w{border-color:var(--warn);background:var(--warn-bg);}
.row .repo{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:30px;font-weight:600;flex:1;letter-spacing:-.01em;}
.row.w .repo{color:var(--warn);}
.row .st{font-size:32px;font-weight:800;color:var(--coral);font-variant-numeric:tabular-nums;white-space:nowrap;}
.row.w .st{color:var(--warn);}
.row .d{font-size:27px;color:var(--ink2);white-space:nowrap;}
.row.w .d{color:var(--warn);font-weight:600;}
.callout{background:linear-gradient(180deg,#fbf6ea,#f7efdf);border:2px solid var(--coral-soft);
  border-left:12px solid var(--coral);border-radius:20px;padding:30px 34px;}
.callout p{font-size:32px;line-height:1.5;}
.callout .hl{color:var(--warn);font-weight:700;}
.punch{font-size:40px;font-weight:800;line-height:1.4;}
.punch .c{color:var(--coral);}
.step{display:flex;gap:24px;align-items:flex-start;}
.step .k{width:64px;height:64px;flex:none;border-radius:50%;background:var(--coral);color:#fff;
  font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.step .t{font-size:36px;line-height:1.4;padding-top:6px;}
.step .t b{color:var(--coral);}
.tags{font-size:28px;color:var(--coral);font-weight:700;line-height:1.6;}
.spacer{flex:1;}
</style>
</head><body>
<div class="card">
  <span class="tag">一次真实的找寻</span>
  <div class="pager">2 / 4</div>
  <div style="height:44px"></div>
  <h1 style="font-size:60px">需求：<span class="c">把 YouTube 视频转成文字</span></h1>
  <div style="height:34px"></div>
  <div class="flow">
    <div class="s"><div class="n">13</div><div class="l">个候选<br>翻回来</div></div>
    <div class="ar">→</div>
    <div class="s"><div class="n">9</div><div class="l">个真正<br>不一样的</div></div>
    <div class="ar">→</div>
    <div class="s"><div class="n">1</div><div class="l">挑个<br>最顺手的</div></div>
  </div>
  <p style="font-size:26px;color:var(--ink2);text-align:center;margin:18px 0 26px">归族先并掉 <b style="color:var(--coral)">4 个转载拷贝</b>，省得你挨个点开发现是同一个</p>
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="row"><div class="repo">michalparkola</div><div class="st">430 ★</div><div class="d">头部·挂 4 个转载</div></div>
    <div class="row"><div class="repo">b33eep</div><div class="st">54 ★</div><div class="d">顺手抽关键帧</div></div>
    <div class="row w"><div class="repo">…-tor</div><div class="st">7 ★</div><div class="d">⚠ 走 Tor 绕封锁</div></div>
  </div>
  <div style="height:26px"></div>
  <div class="callout"><p>那个最唬人的 Tor 版，本机 <b>codex</b> 一审：<span class="hl">会偷偷拿管理员权限 sudo 起 Tor 服务</span>，还是给云端机器人用的——差点就装错。</p></div>
  <div class="spacer"></div>
  <p class="punch">找得<span class="c">全</span>，才看得出<br>「最唬人的」≠「最适合你的」。</p>
</div>
</body></html>
